<!doctype html>
<html lang="ar" dir="rtl" data-theme="dark" data-accent="violet">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>مُساعِد — منظّم الحياة</title>
  <meta name="description" content="تطبيق عربي لتنظيم المهام اليومية والأسبوعية والشهرية، والمال، والاشتراكات، والعادات، والدراسة.">
  <meta name="theme-color" content="#0c0e1d">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="مُساعِد">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%237c5cff'/%3E%3Cstop offset='1' stop-color='%2322d3ee'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Cpath d='M18 33l9 9 19-20' fill='none' stroke='white' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Readex+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <aside id="sidebar" aria-label="القائمة الرئيسية">
      <div class="brand">
        <div class="brand-logo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg>
        </div>
        <div>
          <div class="brand-name">مُساعِد</div>
          <div class="brand-sub">نظّم يومك… وابنِ حياتك</div>
        </div>
      </div>
      <nav id="nav"></nav>
      <div class="sidebar-foot" id="sidebar-foot"></div>
    </aside>
    <div id="scrim"></div>

    <main id="main">
      <header id="topbar">
        <button class="icon-btn only-mobile" data-act="toggle-sidebar" aria-label="القائمة"></button>
        <div class="top-title">
          <h1 id="view-title">لوحة اليوم</h1>
          <div id="top-date" class="top-date"></div>
        </div>
        <div class="top-actions">
          <div id="timer-pill"></div>
          <div id="sync-pill"></div>
          <button class="icon-btn" data-act="open-search" title="بحث (Ctrl+K)" aria-label="بحث" id="btn-search"></button>
          <button class="icon-btn" data-act="toggle-theme" title="تبديل المظهر" aria-label="تبديل المظهر" id="btn-theme"></button>
          <button class="icon-btn bell" data-act="open-inbox" title="التنبيهات" aria-label="التنبيهات" id="btn-bell"></button>
          <button class="btn btn-primary hide-mobile" data-act="quick-add" id="btn-quick"></button>
        </div>
      </header>
      <section id="view" tabindex="-1"></section>
    </main>
  </div>

  <nav id="bottomnav" aria-label="تنقّل سريع"></nav>
  <button id="fab" class="only-mobile" data-act="quick-add" aria-label="إضافة سريعة"></button>
  <div id="modal-root"></div>
  <div id="popover-root"></div>
  <div id="toast-root" aria-live="polite"></div>
  <div id="tooltip" role="tooltip"></div>
  <canvas id="confetti"></canvas>

  <script src="js/core.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/smart.js"></script>
  <script src="js/views/dashboard.js"></script>
  <script src="js/views/planner.js"></script>
  <script src="js/views/calendar.js"></script>
  <script src="js/views/finance.js"></script>
  <script src="js/views/subscriptions.js"></script>
  <script src="js/views/habits.js"></script>
  <script src="js/views/trackers.js"></script>
  <script src="js/views/study.js"></script>
  <script src="js/views/life.js"></script>
  <script src="js/views/settings.js"></script>
  <script src="js/demo.js"></script>
  <script src="js/schedule.js"></script>
  <script src="js/sync-config.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
